<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>騎乗記録</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --ink:#1C272B; --muted:#5B686D; --line:#D2DAD8;
  --accent:#24479A; --accent-ink:#FFFFFF; --accent-soft:#E3E9F6; --hay:#B98714; --danger:#B3261E;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131A1C; --surface:#1C2427; --ink:#E5ECEA; --muted:#97A5A9; --line:#33403F;
    --accent:#93AEF0; --accent-ink:#0E1A38; --accent-soft:#25304A; --hay:#E0B64A; --danger:#F2867D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131A1C; --surface:#1C2427; --ink:#E5ECEA; --muted:#97A5A9; --line:#33403F;
  --accent:#93AEF0; --accent-ink:#0E1A38; --accent-soft:#25304A; --hay:#E0B64A; --danger:#F2867D;
  color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  font-size:15px; line-height:1.6;
}
.mincho{ font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif; }
button,input,select,textarea{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

.wrap{ max-width:1120px; margin:0 auto; padding:28px 20px 48px; }

header.top{ display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 24px; margin-bottom:20px; }
header.top h1{ font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif; font-weight:800; font-size:2.25rem; letter-spacing:.06em; margin:0; line-height:1.2; }
.stats{ color:var(--muted); font-size:.95rem; }
.stats b{ font-family:"Shippori Mincho B1","Hiragino Mincho ProN",serif; font-weight:800; font-size:1.5rem; color:var(--ink); margin:0 2px; font-variant-numeric:tabular-nums; }
.stats span + span{ margin-left:1em; }

.tabs{ display:none; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:4px; margin-bottom:16px; }
.tabs button{ flex:1; border:0; background:transparent; padding:8px 12px; border-radius:999px; cursor:pointer; color:var(--muted); font-weight:500; }
.tabs button[aria-selected="true"]{ background:var(--accent); color:var(--accent-ink); }

.grid{ display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:28px; align-items:start; }
section.panel h2{ font-size:1rem; font-weight:700; margin:0 0 10px; color:var(--muted); }

/* add form */
form.add{
  display:grid; grid-template-columns:150px minmax(0,1fr) 72px minmax(0,1fr) auto; gap:10px; align-items:end;
  background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:22px;
}
label.fld{ display:flex; flex-direction:column; gap:4px; font-size:.8rem; color:var(--muted); min-width:0; }
input[type=text],input[type=date],input[type=number],input:not([type]),select,textarea{
  width:100%; min-width:0; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:15px; color:var(--ink);
}
textarea{ resize:vertical; line-height:1.7; }
.btn{ border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:8px 14px; cursor:pointer; font-weight:500; white-space:nowrap; }
.btn:hover{ border-color:var(--muted); }
.btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.btn.danger{ color:var(--danger); }
.btn.danger[data-armed="1"]{ background:var(--danger); color:var(--surface); border-color:var(--danger); }
.btn.link{ border:0; background:none; padding:4px 2px; color:var(--accent); text-decoration:underline; text-underline-offset:3px; }

.toolbar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
.toolbar select{ width:auto; max-width:12em; }
.toolbar .spacer{ flex:1; }

/* log */
.month{ margin-bottom:18px; }
.month-head{ display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid var(--ink); padding:0 2px 4px; margin-bottom:2px; }
.month-head h3{ margin:0; font-size:1.05rem; font-family:"Shippori Mincho B1","Hiragino Mincho ProN",serif; font-weight:800; }
.month-head span{ color:var(--muted); font-size:.85rem; }
button.ride{
  display:grid; grid-template-columns:6.2em minmax(0,1fr) auto; gap:4px 12px; align-items:baseline;
  width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); padding:10px 4px; cursor:pointer;
}
button.ride:hover{ background:var(--surface); }
.ride .d{ font-variant-numeric:tabular-nums; color:var(--muted); font-size:.9rem; }
.ride .h{ font-family:"Shippori Mincho B1","Hiragino Mincho ProN",serif; font-weight:600; font-size:1.1rem; overflow-wrap:anywhere; }
.ride .c{ font-variant-numeric:tabular-nums; font-weight:700; color:var(--hay); }
.ride .m{ grid-column:2 / 4; color:var(--muted); font-size:.85rem; overflow-wrap:anywhere; }
.empty{ color:var(--muted); background:var(--surface); border:1px dashed var(--line); border-radius:12px; padding:18px; margin:0; }

/* horses */
.horse-list{ background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
button.horse{
  display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 12px; width:100%; text-align:left;
  background:none; border:0; border-bottom:1px solid var(--line); padding:14px 16px; cursor:pointer;
}
button.horse:last-child{ border-bottom:0; }
button.horse:hover{ background:var(--accent-soft); }
button.horse[aria-pressed="true"]{ background:var(--accent-soft); box-shadow:inset 4px 0 0 var(--accent); }
.horse .name{ font-family:"Shippori Mincho B1","Hiragino Mincho ProN",serif; font-weight:800; font-size:1.3rem; line-height:1.3; overflow-wrap:anywhere; }
.horse .num{ grid-row:1 / 3; grid-column:2; align-self:center; text-align:right; }
.horse .num b{ font-family:"Shippori Mincho B1","Hiragino Mincho ProN",serif; font-weight:800; font-size:2rem; font-variant-numeric:tabular-nums; line-height:1; }
.horse .num small{ color:var(--muted); margin-left:2px; }
.horse .tally{ display:flex; flex-wrap:wrap; gap:3px; margin:4px 0 2px; }
.horse .tally svg{ width:20px; height:20px; }
.horse .tally svg path{ stroke:var(--hay); stroke-width:2.2; stroke-linecap:round; fill:none; }
.horse .tally .more{ color:var(--hay); font-size:.8rem; align-self:center; }
.horse .when{ grid-column:1 / 3; color:var(--muted); font-size:.8rem; }
#horsesPanel{ order:-1; }
.period-total{ margin:0 0 10px; color:var(--muted); }
.period-total b{ font-family:"Shippori Mincho B1","Hiragino Mincho ProN",serif; font-weight:800; font-size:1.3rem; color:var(--ink); margin:0 2px; }
.matrix{ margin-top:24px; }
.matrix h3{ font-size:1rem; margin:0 0 8px; color:var(--muted); font-weight:700; }
.mx-scroll{ overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:12px; }
.mx{ border-collapse:collapse; font-size:.85rem; font-variant-numeric:tabular-nums; min-width:100%; }
.mx th,.mx td{ padding:7px 8px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
.mx tbody th{ text-align:left; position:sticky; left:0; background:var(--surface); font-family:"Shippori Mincho B1","Hiragino Mincho ProN",serif; font-weight:600; font-size:.95rem; }
.mx thead th{ color:var(--muted); font-weight:500; }
.mx thead th:first-child, .mx tfoot th{ text-align:left; position:sticky; left:0; background:var(--surface); }
.mx .tot{ font-weight:700; border-left:1px solid var(--line); }
.mx tfoot td, .mx tfoot th{ border-bottom:0; border-top:2px solid var(--ink); font-weight:700; }

/* dialogs */
dialog{ border:1px solid var(--line); border-radius:14px; background:var(--surface); color:var(--ink); padding:0; width:min(560px, calc(100vw - 24px)); max-height:calc(100% - 24px); }
dialog::backdrop{ background:rgba(10,16,18,.45); }
.dlg{ padding:20px; display:flex; flex-direction:column; gap:12px; }
.dlg h2{ margin:0; font-family:"Shippori Mincho B1","Hiragino Mincho ProN",serif; font-weight:800; font-size:1.4rem; overflow-wrap:anywhere; }
.dlg .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.dlg .actions{ display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; margin-top:4px; }
.dlg .actions .left{ margin-right:auto; }
.hint{ color:var(--muted); font-size:.85rem; margin:0; }
.dates{ display:flex; flex-wrap:wrap; gap:6px; max-height:180px; overflow:auto; }
.dates span{ background:var(--bg); border-radius:6px; padding:2px 8px; font-size:.85rem; font-variant-numeric:tabular-nums; }
.preview{ max-height:240px; overflow:auto; border:1px solid var(--line); border-radius:8px; }
.preview table{ border-collapse:collapse; width:100%; font-size:.85rem; }
.preview td,.preview th{ padding:6px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
.preview th{ color:var(--muted); font-weight:500; position:sticky; top:0; background:var(--surface); }
.preview tr.bad td{ color:var(--danger); }
.preview tr.dup td{ color:var(--muted); text-decoration:line-through; }

footer.note{ margin-top:32px; color:var(--muted); font-size:.8rem; }
.toast{ position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:.9rem; max-width:calc(100vw - 32px); opacity:0; pointer-events:none; transition:opacity .2s; }
.toast.show{ opacity:1; }
@media (prefers-reduced-motion: reduce){ .toast{ transition:none; } }

@media (max-width: 900px){
  .tabs{ display:flex; }
  .grid{ grid-template-columns:minmax(0,1fr); }
  main[data-view="log"] #horsesPanel{ display:none; }
  main[data-view="horses"] #logPanel{ display:none; }
  form.add{ grid-template-columns:1fr 1fr; }
  form.add .f-horse, form.add .f-memo{ grid-column:1 / 3; }
  form.add .btn{ grid-column:1 / 3; padding:10px; }
  .wrap{ padding:20px 14px 40px; }
  header.top h1{ font-size:1.9rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>騎乗記録</h1>
    <div class="stats"><span>合計<b id="statTotal">0</b>回</span><span><b id="statHorses">0</b>頭</span></div>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-view="horses">集計</button>
    <button role="tab" aria-selected="false" data-view="log">記録</button>
  </div>

  <main data-view="horses">
    <div class="grid">
      <section class="panel" id="logPanel">
        <form class="add" id="addForm" autocomplete="off">
          <label class="fld f-date">日付<input type="date" name="date" required></label>
          <label class="fld f-horse">馬<input type="text" name="horse" list="horseList" required placeholder="馬の名前"></label>
          <label class="fld f-count">回数<input type="number" name="count" min="1" max="20" value="1" required inputmode="numeric"></label>
          <label class="fld f-memo">メモ<input type="text" name="memo" placeholder="任意"></label>
          <button class="btn primary" type="submit">記録する</button>
        </form>
        <datalist id="horseList"></datalist>

        <div class="toolbar">
          <select id="filterHorse" aria-label="馬で絞り込む"></select>
          <select id="filterYear" aria-label="年で絞り込む"></select>
          <span class="spacer"></span>
          <button class="btn" type="button" id="openImport">まとめて入力</button>
          <button class="btn" type="button" id="exportCsv">CSVで保存</button>
        </div>
        <div id="log"></div>
      </section>

      <section class="panel" id="horsesPanel">
        <div class="toolbar">
          <h2 style="margin:0">集計</h2>
          <span class="spacer"></span>
          <select id="period" aria-label="期間"></select>
          <select id="sortHorses" aria-label="並び順">
            <option value="count">回数が多い順</option>
            <option value="recent">最近乗った順</option>
            <option value="name">名前順</option>
          </select>
        </div>
        <p class="period-total" id="periodTotal"></p>
        <div id="horses"></div>
        <div class="matrix" id="matrix"></div>
      </section>
    </div>
  </main>

  <footer class="note" id="storageNote"></footer>
</div>

<!-- edit one ride -->
<dialog id="editDlg">
  <form class="dlg" id="editForm" method="dialog" autocomplete="off">
    <h2>記録を修正</h2>
    <div class="row2">
      <label class="fld">日付<input type="date" name="date" required></label>
      <label class="fld">回数<input type="number" name="count" min="1" max="20" required inputmode="numeric"></label>
    </div>
    <label class="fld">馬<input type="text" name="horse" list="horseList" required></label>
    <label class="fld">メモ<input type="text" name="memo"></label>
    <div class="actions">
      <button class="btn danger left" type="button" id="deleteRide">削除する</button>
      <button class="btn" type="button" data-close>やめる</button>
      <button class="btn primary" type="submit">保存する</button>
    </div>
  </form>
</dialog>

<!-- one horse -->
<dialog id="horseDlg">
  <div class="dlg">
    <h2 id="hName"></h2>
    <p class="hint" id="hStats"></p>
    <div class="dates" id="hDates"></div>
    <label class="fld">名前を修正（すでにある馬の名前にすると、その馬の記録にまとめます）
      <input type="text" id="hRename" list="horseList">
    </label>
    <div class="actions">
      <button class="btn link left" type="button" id="hShow">この馬の記録だけ表示</button>
      <button class="btn" type="button" data-close>閉じる</button>
      <button class="btn primary" type="button" id="hRenameBtn">名前を修正</button>
    </div>
  </div>
</dialog>

<!-- bulk import -->
<dialog id="importDlg">
  <div class="dlg">
    <h2>まとめて入力</h2>
    <p class="hint">1行に1回分。日付・馬の名前・回数（省略すると1）・メモの順に、スペースかカンマで区切って貼り付けてください。「CSVで保存」したファイルもそのまま読み込めます。</p>
    <p class="hint"><button class="btn" type="button" id="pickFile">CSVファイルから読み込む</button><input type="file" id="fileInput" accept=".csv,.txt,text/csv,text/plain" hidden></p>
    <textarea id="importText" rows="7" placeholder="2026/10/12 ハヤテ&#10;2026/10/19 ハヤテ 2 部班&#10;10/26 シルバー"></textarea>
    <label class="fld" style="max-width:220px">年が書いていない日付の年<input type="number" id="importYear" min="1990" max="2100"></label>
    <div id="importPreview"></div>
    <div class="actions">
      <button class="btn" type="button" data-close>やめる</button>
      <button class="btn" type="button" id="parseBtn">読み取る</button>
      <button class="btn primary" type="button" id="importBtn" hidden></button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const WD = ['日','月','火','水','木','金','土'];
  const state = { rides:[], mode:'loading', filterHorse:'', filterYear:'', period:'', sort:'count', editing:null, horse:null, pending:[] };
  let backend = null;

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pad = n => String(n).padStart(2,'0');
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
  const newId = () => 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);

  const cnt = r => Math.max(1, parseInt(r.count,10) || 1);
  const sum = arr => arr.reduce((a,r) => a + cnt(r), 0);
  function dParts(iso){ const [y,m,d] = iso.split('-').map(Number); return {y,m,d,wd:WD[new Date(y,m-1,d).getDay()]}; }
  function fmtShort(iso){ const p = dParts(iso); return `${p.m}/${p.d}（${p.wd}）`; }
  function fmtLong(iso){ const p = dParts(iso); return `${p.y}年${p.m}月${p.d}日`; }

  let toastTimer;
  function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2600); }

  /* ---------- storage ---------- */

: 1762000000016}, {"id": "memo17", "kind": "ride", "date": "2026-08-17", "horse": "エルメス", "count": 1, "memo": "", "createdAt": 1762000000017}, {"id": "memo18", "kind": "ride", "date": "2026-08-28", "horse": "エルメス", "count": 1, "memo": "", "createdAt": 1762000000018}, {"id": "memo19", "kind": "ride", "date": "2026-09-13", "horse": "エルメス", "count": 1, "memo": "", "createdAt": 1762000000019}, {"id": "memo20", "kind": "ride", "date": "2026-09-19", "horse": "エルメス", "count": 1, "memo": "", "createdAt": 1762000000020}, {"id": "memo21", "kind": "ride", "date": "2026-10-03", "horse": "エルメス", "count": 1, "memo": "", "createdAt": 1762000000021}, {"id": "memo22", "kind": "ride", "date": "2026-10-10", "horse": "エルメス", "count": 1, "memo": "", "createdAt": 1762000000022}, {"id": "memo23", "kind": "ride", "date": "2026-10-12", "horse": "エルメス", "count": 1, "memo": "", "createdAt": 1762000000023}, {"id": "memo24", "kind": "ride", "date": "2026-10-18", "horse": "エルメス", "count": 1, "memo": "", "createdAt": 1762000000024}, {"id": "memo25", "kind": "ride", "date": "2026-10-24", "horse": "エルメス", "count": 1, "memo": "", "createdAt": 1762000000025}, {"id": "memo26", "kind": "ride", "date": "2026-11-01", "horse": "エルメス", "count": 1, "memo": "", "createdAt": 1762000000026}, {"id": "memo27", "kind": "ride", "date": "2026-06-13", "horse": "レグルス", "count": 1, "memo": "", "createdAt": 1762000000027}, {"id": "memo28", "kind": "ride", "date": "2026-07-05", "horse": "FF", "count": 1, "memo": "", "createdAt": 1762000000028}];
  const NATIVE = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.save);
  function persist(){
    if(NATIVE){ try{ window.webkit.messageHandlers.save.postMessage(JSON.stringify(state.rides)); }catch(e){ toast('保存できませんでした。'); } return; }
    try{ localStorage.setItem(LKEY, JSON.stringify(state.rides)); }catch(e){ toast('保存できませんでした。'); }
  }
  function useLocal(){
    state.mode = 'local';
    let first = false;
    if(NATIVE){
      if(Array.isArray(window.NATIVE_RIDES)) state.rides = window.NATIVE_RIDES;
      else { state.rides = SEED.slice(); first = true; }
    } else {
      try{
        const raw = localStorage.getItem(LKEY);
        if(raw === null){ state.rides = SEED.slice(); first = true; } else state.rides = JSON.parse(raw);
      }catch(e){ state.rides = []; }
    }
    if(first) persist();
    backend = {
      async put(r){ const i = state.rides.findIndex(x => x.id === r.id); if(i >= 0) state.rides[i] = r; else state.rides.push(r); persist(); render(); },
      async remove(id){ state.rides = state.rides.filter(x => x.id !== id); persist(); render(); }
    };
    render();
  }

  function init(){ useLocal(); }

  async function putRide(r){
    if(!backend){ toast('まだ読み込み中です。少し待ってからもう一度押してください。'); return false; }
    try{ await backend.put(r); return true; }
    catch(e){ toast('保存できませんでした。もう一度試してください。'); return false; }
  }
  async function removeRide(id){
    try{ await backend.remove(id); return true; }
    catch(e){ toast('削除できませんでした。もう一度試してください。'); return false; }
  }

  /* ---------- derived ---------- */
  function sorted(arr){ return arr.slice().sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (b.createdAt||0) - (a.createdAt||0)); }
  function periodRides(){ return state.period ? state.rides.filter(r => r.date.slice(0,4) === state.period) : state.rides; }
  function horses(src = state.rides){
    const map = new Map();
    for(const r of src){
      const h = map.get(r.horse) || { name:r.horse, count:0, first:r.date, last:r.date, rides:[] };
      h.count += cnt(r); h.rides.push(r);
      if(r.date < h.first) h.first = r.date;
      if(r.date > h.last) h.last = r.date;
      map.set(r.horse, h);
    }
    const list = [...map.values()];
    const byName = (a,b) => a.name.localeCompare(b.name, 'ja');
    if(state.sort === 'name') list.sort(byName);
    else if(state.sort === 'recent') list.sort((a,b) => a.last < b.last ? 1 : a.last > b.last ? -1 : byName(a,b));
    else list.sort((a,b) => b.count - a.count || byName(a,b));
    return list;
  }
  function filtered(){
    return sorted(state.rides.filter(r =>
      (!state.filterHorse || r.horse === state.filterHorse) &&
      (!state.filterYear || r.date.slice(0,4) === state.filterYear)));
  }

  /* ---------- render ---------- */
  function tallySvg(n){
    const P = ['M3 3.5H17','M10 3.5V17','M10 10H15','M5 10V17','M2 17H18'];
    const max = 60; const shown = Math.min(n, max);
    let out = '';
    for(let i = 0; i < shown; i += 5){
      const k = Math.min(5, shown - i);
      out += '<svg viewBox="0 0 20 20" aria-hidden="true">' + P.slice(0,k).map(d => `<path d="${d}"/>`).join('') + '</svg>';
    }
    if(n > max) out += `<span class="more">ほか${n - max}回</span>`;
    return out;
  }

  function render(){
    const hs = horses();
    $('#statTotal').textContent = sum(state.rides);
    $('#statHorses').textContent = hs.length;

    $('#horseList').innerHTML = hs.map(h => `<option value="${esc(h.name)}">`).join('');

    if(state.filterHorse && !hs.some(h => h.name === state.filterHorse)) state.filterHorse = '';
    $('#filterHorse').innerHTML = '<option value="">すべての馬</option>' +
      hs.slice().sort((a,b)=>a.name.localeCompare(b.name,'ja')).map(h => `<option value="${esc(h.name)}">${esc(h.name)}</option>`).join('');
    $('#filterHorse').value = state.filterHorse;

    const years = [...new Set(state.rides.map(r => r.date.slice(0,4)))].sort().reverse();
    if(state.filterYear && !years.includes(state.filterYear)) state.filterYear = '';
    $('#filterYear').innerHTML = '<option value="">すべての年</option>' + years.map(y => `<option value="${y}">${y}年</option>`).join('');
    $('#filterYear').value = state.filterYear;

    if(state.period && !years.includes(state.period)) state.period = '';
    $('#period').innerHTML = '<option value="">すべての期間</option>' + years.map(y => `<option value="${y}">${y}年</option>`).join('');
    $('#period').value = state.period;
    const pr = periodRides(), phs = horses(pr);
    $('#periodTotal').innerHTML = state.mode === 'loading' || !state.rides.length ? '' :
      `${state.period ? state.period + '年' : 'これまで'}の合計<b>${sum(pr)}</b>回、<b>${phs.length}</b>頭`;

    renderLog();
    renderHorses(phs);
    renderMatrix(phs, pr);

    $('#storageNote').textContent =
      state.mode === 'local' ? '記録はこのiPhoneの中に保存されます。アプリを削除すると記録も消えるので、ときどき「CSVで保存」でバックアップしてください。' : '';
  }

  function renderLog(){
    const el = $('#log');
    if(state.mode === 'loading'){ el.innerHTML = '<p class="empty">記録を読み込んでいます…</p>'; return; }
    if(!state.rides.length){ el.innerHTML = '<p class="empty">まだ記録がありません。上の欄に日付と馬の名前を入れて「記録する」を押すか、「まとめて入力」で過去の記録を貼り付けてください。</p>'; return; }
    const list = filtered();
    if(!list.length){ el.innerHTML = '<p class="empty">この条件に合う記録はありません。</p>'; return; }
    const groups = [];
    for(const r of list){
      const key = r.date.slice(0,7);
      let g = groups[groups.length-1];
      if(!g || g.key !== key){ g = { key, rides:[] }; groups.push(g); }
      g.rides.push(r);
    }
    el.innerHTML = groups.map(g => {
      const [y,m] = g.key.split('-').map(Number);
      return `<div class="month"><div class="month-head"><h3>${y}年${m}月</h3><span>${sum(g.rides)}回</span></div>` +
        g.rides.map(r => `<button type="button" class="ride" data-id="${esc(r.id)}">
          <span class="d">${fmtShort(r.date)}</span>
          <span class="h">${esc(r.horse)}</span>
          <span class="c">${cnt(r) > 1 ? cnt(r) + '回' : ''}</span>
          ${r.memo ? `<span class="m">${esc(r.memo)}</span>` : ''}
        </button>`).join('') + '</div>';
    }).join('');
  }

  function renderHorses(hs){
    const el = $('#horses');
    if(state.mode === 'loading'){ el.innerHTML = '<p class="empty">読み込んでいます…</p>'; return; }
    if(!hs.length){ el.innerHTML = state.rides.length ? '<p class="empty">この期間の記録はありません。</p>' : '<p class="empty">記録を入れると、ここに馬ごとの回数が並びます。「記録」から1回ずつ入れるか、「まとめて入力」で過去の記録を貼り付けてください。</p>'; return; }
    el.innerHTML = '<div class="horse-list">' + hs.map(h => `<button type="button" class="horse" data-name="${esc(h.name)}" aria-pressed="${state.filterHorse === h.name}">
        <span class="name">${esc(h.name)}</span>
        <span class="num"><b>${h.count}</b><small>回</small></span>
        <span class="tally">${tallySvg(h.count)}</span>
        <span class="when">最後に乗った日 ${fmtLong(h.last)}${h.first !== h.last ? `　初めて ${fmtLong(h.first)}` : ''}</span>
      </button>`).join('') + '</div>';
  }

  function renderMatrix(hs, src){
    const el = $('#matrix');
    if(state.mode === 'loading' || !hs.length){ el.innerHTML = ''; return; }
    let cols, keyOf, label, title;
    if(state.period){
      cols = Array.from({ length:12 }, (_, i) => i + 1); keyOf = r => +r.date.slice(5,7); label = c => c + '月'; title = `${state.period}年の月別回数`;
    } else {
      cols = [...new Set(state.rides.map(r => +r.date.slice(0,4)))].sort((a,b) => a - b); keyOf = r => +r.date.slice(0,4); label = c => c + '年'; title = '年別回数';
    }
    const cell = new Map(), colTot = new Map();
    let max = 0;
    for(const r of src){
      const k = r.horse + '\u0000' + keyOf(r);
      const v = (cell.get(k) || 0) + cnt(r);
      cell.set(k, v); if(v > max) max = v;
      colTot.set(keyOf(r), (colTot.get(keyOf(r)) || 0) + cnt(r));
    }
    const td = v => v ? `<td style="background:color-mix(in srgb, var(--hay) ${Math.round(12 + 48 * v / max)}%, transparent)">${v}</td>` : '<td></td>';
    el.innerHTML = `<h3>${title}</h3><div class="mx-scroll"><table class="mx"><thead><tr><th>馬</th>${cols.map(c => `<th>${label(c)}</th>`).join('')}<th class="tot">合計</th></tr></thead><tbody>` +
      hs.map(h => `<tr><th>${esc(h.name)}</th>${cols.map(c => td(cell.get(h.name + '\u0000' + c) || 0)).join('')}<td class="tot">${h.count}</td></tr>`).join('') +
      `</tbody><tfoot><tr><th>合計</th>${cols.map(c => `<td>${colTot.get(c) || ''}</td>`).join('')}<td class="tot">${sum(src)}</td></tr></tfoot></table></div>`;
  }

  /* ---------- add ---------- */
  const addForm = $('#addForm');
  addForm.date.value = today();
  addForm.addEventListener('submit', async e => {
    e.preventDefault();
    const horse = norm(addForm.horse.value);
    if(!horse){ addForm.horse.focus(); return; }
    const r = { id:newId(), kind:'ride', date:addForm.date.value, horse, count:cnt({count:addForm.count.value}), memo:norm(addForm.memo.value), createdAt:Date.now() };
    if(await putRide(r)){
      toast(`${fmtShort(r.date)} ${horse} を記録しました`);
      addForm.memo.value = ''; addForm.count.value = 1;
    }
  });

  /* ---------- filters / tabs ---------- */
  $('#filterHorse').addEventListener('change', e => { state.filterHorse = e.target.value; render(); });
  $('#filterYear').addEventListener('change', e => { state.filterYear = e.target.value; render(); });
  $('#sortHorses').addEventListener('change', e => { state.sort = e.target.value; render(); });
  $('#period').addEventListener('change', e => { state.period = e.target.value; render(); });
  function setView(v){
    $('main').dataset.view = v;
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === v)));
  }
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));

  document.querySelectorAll('dialog [data-close]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close()));

  /* ---------- edit ride ---------- */
  const editDlg = $('#editDlg'), editForm = $('#editForm'), delBtn = $('#deleteRide');
  $('#log').addEventListener('click', e => {
    const b = e.target.closest('button.ride'); if(!b) return;
    const r = state.rides.find(x => x.id === b.dataset.id); if(!r) return;
    state.editing = r;
    editForm.date.value = r.date; editForm.count.value = cnt(r); editForm.horse.value = r.horse; editForm.memo.value = r.memo || '';
    delBtn.dataset.armed = ''; delBtn.textContent = '削除する';
    editDlg.showModal();
  });
  editForm.addEventListener('submit', async e => {
    e.preventDefault();
    const r = state.editing; if(!r) return;
    const horse = norm(editForm.horse.value); if(!horse){ editForm.horse.focus(); return; }
    const next = Object.assign({}, r, { date:editForm.date.value, horse, count:cnt({count:editForm.count.value}), memo:norm(editForm.memo.value), updatedAt:Date.now() });
    if(await putRide(next)){ editDlg.close(); toast('修正しました'); }
  });
  delBtn.addEventListener('click', async () => {
    if(delBtn.dataset.armed !== '1'){ delBtn.dataset.armed = '1'; delBtn.textContent = 'もう一度押すと削除'; return; }
    if(state.editing && await removeRide(state.editing.id)){ editDlg.close(); toast('削除しました'); }
  });

  /* ---------- horse detail / rename ---------- */
  const horseDlg = $('#horseDlg');
  $('#horses').addEventListener('click', e => {
    const b = e.target.closest('button.horse'); if(!b) return;
    const h = horses().find(x => x.name === b.dataset.name); if(!h) return;
    state.horse = h.name;
    $('#hName').textContent = h.name;
    $('#hStats').textContent = `${h.count}回　最後に乗った日 ${fmtLong(h.last)}　初めて ${fmtLong(h.first)}`;
    $('#hDates').innerHTML = sorted(h.rides).map(r => `<span>${r.date.replace(/-/g,'/')}${cnt(r) > 1 ? ' ×' + cnt(r) : ''}</span>`).join('');
    $('#hRename').value = h.name;
    horseDlg.showModal();
  });
  $('#hShow').addEventListener('click', () => {
    state.filterHorse = state.horse; state.filterYear = '';
    horseDlg.close(); setView('log'); render();
    $('#logPanel').scrollIntoView({ block:'start' });
  });
  $('#hRenameBtn').addEventListener('click', async () => {
    const from = state.horse, to = norm($('#hRename').value);
    if(!to || to === from){ horseDlg.close(); return; }
    const targets = state.rides.filter(r => r.horse === from);
    const merging = state.rides.some(r => r.horse === to);
    const btn = $('#hRenameBtn'); btn.disabled = true;
    let ok = 0;
    for(const r of targets){ if(await putRide(Object.assign({}, r, { horse:to, updatedAt:Date.now() }))) ok++; else break; }
    btn.disabled = false;
    if(state.filterHorse === from) state.filterHorse = to;
    horseDlg.close(); render();
    if(ok === targets.length) toast(merging ? `「${from}」の${ok}件を「${to}」にまとめました` : `「${from}」を「${to}」に修正しました（${ok}件）`);
    else toast(`${targets.length}件中${ok}件まで修正しました。もう一度試してください。`);
  });

  /* ---------- bulk import ---------- */
  const importDlg = $('#importDlg');
  $('#openImport').addEventListener('click', () => {
    $('#importYear').value = new Date().getFullYear();
    $('#importPreview').innerHTML = ''; $('#importBtn').hidden = true; state.pending = [];
    importDlg.showModal();
  });
  function mkDate(y,m,d){
    const dt = new Date(y, m-1, d);
    if(dt.getFullYear() !== y || dt.getMonth() !== m-1 || dt.getDate() !== d) return null;
    return `${y}-${pad(m)}-${pad(d)}`;
  }
  function parseDate(tok, yDef){
    let m = tok.match(/^(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})日?$/); if(m) return mkDate(+m[1], +m[2], +m[3]);
    m = tok.match(/^(\d{4})(\d{2})(\d{2})$/); if(m) return mkDate(+m[1], +m[2], +m[3]);
    m = tok.match(/^(\d{1,2})[\/月](\d{1,2})日?$/); if(m) return mkDate(yDef, +m[1], +m[2]);
    return null;
  }
  function parseLines(text, yDef){
    const out = [];
    const existing = new Set(state.rides.map(r => r.date + '\u0000' + r.horse));
    const seen = new Set();
    text.split(/\r?\n/).forEach((raw, i) => {
      const line = raw.replace(/[（(][日月火水木金土][）)]/g, '').trim();
      if(!line) return;
      const toks = line.split(/[\s,\t、，]+/).map(s => s.replace(/^"|"$/g, '')).filter(Boolean);
      if(i === 0 && /日付|date/i.test(toks[0])) return;
      let date = null, horse = '', count = 1, countSet = false; const memo = [];
      for(const t of toks){
        if(!date){ const d = parseDate(t, yDef); if(d){ date = d; continue; } }
        const c = t.match(/^[×xX*]?(\d{1,2})(回|鞍)?$/);
        if(date && horse && c && !countSet){ count = Math.max(1, +c[1]); countSet = true; continue; }
        if(date && !horse){ horse = t; continue; }
        if(date) memo.push(t);
      }
      const row = { raw, date, horse, count, memo:memo.join(' ') };
      if(!date) row.error = '日付が読み取れません';
      else if(!horse) row.error = '馬の名前がありません';
      else {
        const k = date + '\u0000' + horse;
        if(existing.has(k)) row.dup = 'すでに記録済み';
        else if(seen.has(k)) row.dup = '同じ行が上にあります';
        seen.add(k);
      }
      out.push(row);
    });
    return out;
  }
  $('#parseBtn').addEventListener('click', () => {
    const yDef = parseInt($('#importYear').value, 10) || new Date().getFullYear();
    const rows = parseLines($('#importText').value, yDef);
    const good = rows.filter(r => !r.error && !r.dup);
    state.pending = good;
    const pv = $('#importPreview');
    if(!rows.length){ pv.innerHTML = '<p class="hint">貼り付けた内容が空です。</p>'; $('#importBtn').hidden = true; return; }
    pv.innerHTML = `<p class="hint">${rows.length}行を読み取りました。追加できるのは${good.length}件です。取り消し線の行は追加しません。</p>
      <div class="preview"><table><thead><tr><th>日付</th><th>馬</th><th>回数</th><th>メモ・状態</th></tr></thead><tbody>` +
      rows.map(r => r.error
        ? `<tr class="bad"><td colspan="3">${esc(r.raw)}</td><td>${r.error}</td></tr>`
        : `<tr class="${r.dup ? 'dup' : ''}"><td>${r.date.replace(/-/g,'/')}</td><td>${esc(r.horse)}</td><td>${r.count}</td><td>${esc(r.dup || r.memo)}</td></tr>`).join('') +
      '</tbody></table></div>';
    const ib = $('#importBtn');
    ib.hidden = !good.length; ib.textContent = `${good.length}件を追加する`;
  });
  $('#importBtn').addEventListener('click', async () => {
    const ib = $('#importBtn'); ib.disabled = true;
    let ok = 0; const now = Date.now();
    for(const [i, r] of state.pending.entries()){
      if(await putRide({ id:newId(), kind:'ride', date:r.date, horse:r.horse, count:r.count, memo:r.memo, createdAt:now + i })) ok++; else break;
    }
    ib.disabled = false;
    importDlg.close(); $('#importText').value = ''; state.pending = [];
    toast(`${ok}件を追加しました`);
  });

  /* ---------- export ---------- */
  $('#exportCsv').addEventListener('click', async () => {
    const rows = [['日付','馬','回数','メモ'], ...sorted(state.rides).reverse().map(r => [r.date.replace(/-/g,'/'), r.horse, cnt(r), r.memo || ''])];
    const csv = '\ufeff' + rows.map(row => row.map(c => { c = String(c); return /[",\r\n]/.test(c) ? '"' + c.replace(/"/g,'""') + '"' : c; }).join(',')).join('\r\n');
    const d = new Date();
    const name = `騎乗記録_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.csv`;
    if(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.share){
      window.webkit.messageHandlers.share.postMessage({ filename:name, text:csv }); return;
    }
    const blob = new Blob([csv], { type:'text/csv;charset=utf-8' });
    try{
      const file = new File([blob], name, { type:'text/csv' });
      if(navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:'騎乗記録' }); return; }
    }catch(e){ if(e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  });

  $('#pickFile').addEventListener('click', () => $('#fileInput').click());
  $('#fileInput').addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0]; if(!f) return;
    $('#importText').value = (await f.text()).replace(/^\ufeff/, '');
    e.target.value = '';
    $('#parseBtn').click();
  });


  init();
})();
</script>
</body>
</html>
